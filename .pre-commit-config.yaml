repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-json

    - repo: local
      hooks:
          - id: readyreact-typescript
            name: ReadyReact TypeScript Check
            entry: npx tsc --noEmit
            language: system
            pass_filenames: false

          - id: readyreact-eslint
            name: ReadyReact ESLint Check
            entry: npx eslint --fix
            language: system
            files: \.(js|jsx|ts|tsx)$

          - id: readyreact-commit-msg
            name: ReadyReact Commit Message Check
            entry: python hooks/commit-msg/readyreact-commit-msg.py
            language: system
            stages: [commit-msg]

          - id: readyreact-protect-main
            name: ReadyReact Protect Main Branch Check
            entry: python hooks/pre-commit/readyreact-protect-main.py
            language: system
            pass_filenames: false

          - id: readyreact-prettier
            name: ReadyReact Prettier Check
            entry: npx prettier --write --ignore-unknown
            language: system
            files: \.(js|jsx|ts|tsx|json|css|scss|md|yaml|yml)$

          - id: readyreact-tests
            name: ReadyReact Tests Check
            entry: npm test -- --runInBand --watch=false
            language: system
            pass_filenames: false
            files: \.(js|jsx|ts|tsx|json|css|scss|md|yaml|yml)$

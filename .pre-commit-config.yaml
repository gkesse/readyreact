repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-json

    - repo: local
      hooks:
          - id: readyreact-typescript-check
            name: ReadyReact TypeScript Check
            entry: npx tsc --noEmit
            language: system
            pass_filenames: false

          - id: readyreact-eslint-check
            name: ReadyReact ESLint Check
            entry: npx eslint
            language: system
            files: \.(js|jsx|ts|tsx)$

          - id: readyreact-commit-msg-check
            name: ReadyReact Commit Message Check
            entry: python hooks/commit-msg/readyreact-commit-msg-check.py
            language: system
            stages: [commit-msg]

          - id: readyreact-protect-main
            name: ReadyReact Protect Main Branch
            entry: python hooks/pre-commit/readyreact-protect-main.py
            language: system
            pass_filenames: false

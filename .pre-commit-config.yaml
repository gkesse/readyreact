repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-json

    - repo: local
      hooks:
          - id: readyreact-typescript-check
            name: ReadyReact TypeScript Check
            entry: npx tsc --noEmit
            language: system
            pass_filenames: false

          - id: readyreact-eslint-check
            name: ReadyReact ESLint Check
            entry: npx eslint
            language: system
            files: \.(js|jsx|ts|tsx)$
